<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CondoExpress 📦</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function(){ emailjs.init("TWDbG3DvjSw6fxXhr"); })();
    </script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body {background:#f0f4f8; padding:15px; max-width:600px; margin:0 auto;}
        .aba {display:flex; gap:5px; margin-bottom:20px;}
        .aba-btn {flex:1; padding:12px; border:none; background:#ddd; border-radius:8px; font-weight:bold; cursor:pointer;}
        .aba-btn.ativo {background:#1a73e8; color:white;}
        .pagina {display:none;}
        .pagina.ativa {display:block;}
        header {background:#1a73e8; color:white; padding:20px; border-radius:12px; text-align:center; margin-bottom:20px;}
        section {background:white; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.08);}
        h2 {color:#1a73e8; margin-bottom:15px; font-size:18px;}
        label {display:block; margin:12px 0 4px; font-weight:bold; color:#333;}
        input, select, textarea {width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px;}
        button {padding:14px; border:none; border-radius:8px; font-size:17px; font-weight:bold; cursor:pointer; transition:0.2s; margin-top:15px; width:100%;}
        .btn-verde {background:#28c76f; color:white;}
        .btn-verde:hover {background:#20aa5d;}
        .item-encomenda {border-bottom:1px solid #eee; padding:12px 0;}
        .item-encomenda:last-child {border:none;}
        .nova {background:#fff3cd; border-left:4px solid #ffc107; padding:10px; border-radius:4px; margin:8px 0;}
        .msg-sucesso {color:green; margin-top:15px; display:none; font-weight:bold; text-align:center;}
        .msg-erro {color:red; margin-top:10px; display:none; text-align:center;}
        .sem-dados {color:#888; text-align:center; padding:20px;}
    </style>
</head>
<body>

<header>
    <h1>🏢 CondoExpress</h1>
    <p id="subtitulo">Controle de Encomendas</p>
</header>

<!-- ABAS: Portaria / Morador -->
<div class="aba">
    <button class="aba-btn ativo" onclick="trocarAba('portaria')">🔐 Portaria</button>
    <button class="aba-btn" onclick="trocarAba('morador')">🏠 Área do Morador</button>
</div>

<!-- ===================================== ÁREA DA PORTARIA ===================================== -->
<div id="pag-portaria" class="pagina ativa">
    <section>
        <h2>📦 Registrar Encomenda</h2>
        <form id="formRegistro">
            <label>Nome do Morador</label>
            <input type="text" id="nome" required>

            <label>Apartamento / Bloco</label>
            <input type="text" id="apartamento" required placeholder="Ex: 112 — Bloco B">

            <label>E-mail do Morador</label>
            <input type="email" id="email" required>

            <label>Empresa / Loja</label>
            <input type="text" id="empresa" placeholder="Ex: Shopee, Correios">

            <label>Nota Fiscal / Código</label>
            <input type="text" id="notafiscal">

            <label>Recado / Observação</label>
            <textarea id="mensagem" rows="3" placeholder="Ex: Retirar até..."></textarea>

            <button type="submit" class="btn-verde">✅ Registrar + Avisar Morador</button>
            <div class="msg-sucesso" id="avisoSucesso">✅ Encomenda registrada e morador avisado!</div>
            <div class="msg-erro" id="avisoErro">❌ Erro ao enviar aviso.</div>
        </form>
    </section>

    <section>
        <h2>📋 Encomendas Registradas</h2>
        <div id="listaPortaria" class="sem-dados">Nenhuma encomenda registrada ainda.</div>
    </section>
</div>

<!-- ===================================== ÁREA DO MORADOR ===================================== -->
<div id="pag-morador" class="pagina">
    <section>
        <h2>🔍 Verificar Minhas Encomendas</h2>
        <label>Digite seu Apartamento / Bloco</label>
        <input type="text" id="filtroApto" placeholder="Ex: 112 — Bloco B">
        <button class="btn-verde" onclick="mostrarMinhas()">🔎 Verificar</button>
    </section>

    <section>
        <h2>📦 Minhas Encomendas</h2>
        <div id="listaMorador" class="sem-dados">Digite seu apartamento acima para verificar.</div>
    </section>
</div>

<script>
let encomendas = JSON.parse(localStorage.getItem('encomendas') || '[]');

function trocarAba(nome) {
    document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativo'));
    event.target.classList.add('ativo');
    document.querySelectorAll('.pagina').forEach(p => p.classList.remove('ativa'));
    document.getElementById('pag-'+nome).classList.add('ativa');
    if(nome === 'portaria') atualizarListaPortaria();
}

function salvarDados() {
    localStorage.setItem('encomendas', JSON.stringify(encomendas));
}

function atualizarListaPortaria() {
    const div = document.getElementById('listaPortaria');
    if(encomendas.length === 0) {
        div.innerHTML = '<p class="sem-dados">Nenhuma encomenda registrada ainda.</p>';
        return;
    }
    div.innerHTML = encomendas.map((e, i) => `
        <div class="item-encomenda">
            <strong>${e.nome}</strong><br>
            🏠 ${e.apartamento}<br>
            🏬 ${e.empresa || 'Não informada'}<br>
            📄 ${e.notafiscal || 'Não informada'}<br>
            📅 ${e.data}<br>
            ${e.mensagem ? '💬 ' + e.mensagem + '<br>' : ''}
            <button style="background:#ff4444; font-size:14px; padding:8px; margin-top:5px;" onclick="excluir(${i})">🗑️ Marcar retirada</button>
        </div>
    `).reverse().join('');
}

function mostrarMinhas() {
    const apt = document.getElementById('filtroApto').value.trim();
    const div = document.getElementById('listaMorador');
    if(!apt) {
        div.innerHTML = '<p class="sem-dados">Digite seu apartamento.</p>';
        return;
    }
    const minhas = encomendas.filter(e => e.apartamento.trim() === apt);
    if(minhas.length === 0) {
        div.innerHTML = '<p class="sem-dados">Nenhuma encomenda encontrada para este apartamento.</p>';
        return;
    }
    div.innerHTML = minhas.map(e => `
        <div class="item-encomenda nova">
            📦 <strong>NOVA ENCOMENDA!</strong><br>
            <strong>${e.nome}</strong><br>
            🏬 ${e.empresa || 'Não informada'}<br>
            📅 ${e.data}<br>
            ${e.mensagem ? '💬 ' + e.mensagem + '<br>' : ''}
            <em>Por favor, retire na portaria!</em>
        </div>
    `).reverse().join('');
}

function excluir(indice) {
    if(confirm('Marcar como retirada?')) {
        encomendas.splice(indice, 1);
        salvarDados();
        atualizarListaPortaria();
    }
}

// ==== CADASTRAR E ENVIAR E-MAIL ====
document.getElementById('formRegistro').addEventListener('submit', function(e) {
    e.preventDefault();

    const nova = {
        nome: document.getElementById('nome').value,
        apartamento: document.getElementById('apartamento').value,
        email: document.getElementById('email').value,
        empresa: document.getElementById('empresa').value || 'Não informada',
        notafiscal: document.getElementById('notafiscal').value || '—',
        mensagem: document.getElementById('mensagem').value || 'Retire sua encomenda na portaria!',
        data: new Date().toLocaleString('pt-BR')
    };

    encomendas.push(nova);
    salvarDados();
    atualizarListaPortaria();

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    emailjs.sendForm('service_t2de096', 'template_axu51ce', e.target)
        .then(() => {
            document.getElementById('avisoSucesso').style.display = 'block';
            document.getElementById('avisoErro').style.display = 'none';
            e.target.reset();
            setTimeout(() => document.getElementById('avisoSucesso').style.display = 'none', 4000);
        }, () => {
            document.getElementById('avisoErro').style.display = 'block';
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = '✅ Registrar + Avisar Morador';
        });
});

// Carregar lista ao abrir
atualizarListaPortaria();
</script>

</body>
</html>
