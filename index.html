<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CondoExpress — Encomendas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#1769e0;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:21px}.container{max-width:1050px;margin:24px auto;padding:0 16px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
nav button{background:white;color:#1769e0;box-shadow:0 2px 8px #0001}
nav button.active,button.primary{background:#1769e0;color:white}
button.secondary{background:#e5e7eb;color:#374151}
button.blue{background:#1769e0;color:white}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 15px #00000012;margin-bottom:18px}
h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce2;border-radius:9px;font-size:15px}
.hidden{display:none}.search{margin-bottom:15px;width:260px;max-width:100%}
.package{border:1px solid #e2e6eb;border-radius:12px;padding:15px;margin:10px 0}
.status{display:inline-block;padding:6px 12px;border-radius:20px;background:#fff3cd;color:#8a6500;font-size:14px;font-weight:bold;margin:8px 0}
.small{color:#6b7280;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}.stat b{font-size:28px;display:block;margin-top:5px}
.login-overlay{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:white;width:min(420px,100%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0002}
.login-card h2{margin-top:0}.role-tabs{display:flex;gap:8px;margin-bottom:18px}
.role-tabs button{flex:1;background:#eef2f7}.role-tabs button.active{background:#1769e0;color:white}
.userbar{font-size:13px;display:flex;align-items:center;gap:8px}
.logout{background:#ffffff22;color:white;padding:7px 10px}
.record-block{margin-top:18px;padding-top:18px;border-top:1px solid #eee}
.chat-box{background:#f3f4f6;border-radius:12px;padding:16px;margin:12px 0;min-height:120px}
.chat-msg{background:#e5e7eb;border-radius:12px;padding:12px;margin:8px 0;max-width:85%}
.chat-msg.from-admin{background:#dbeafe;margin-left:0}
.chat-input-area{display:flex;gap:8px;margin-top:10px}
.chat-input-area input{flex:1}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>📦 CondoExpress</h2>
    <p>Entre para acessar o sistema.</p>
    <div class="role-tabs">
      <button id="adminTab" class="active" onclick="setLoginRole('admin')">Portaria</button>
      <button id="residentTab" onclick="setLoginRole('resident')">Morador</button>
    </div>
    <div id="adminLogin">
      <label>Usuário</label><input id="loginUser" autocomplete="off">
      <br><br><label>Senha</label><input id="loginPass" type="password" autocomplete="new-password">
    </div>
    <div id="residentLogin" class="hidden">
      <label>Usuário do morador</label><input id="residentUser" autocomplete="off">
      <br><br><label>Senha</label><input id="residentPass" type="password" autocomplete="new-password">
    </div>
    <br><button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
    <p id="loginError" style="color:#c62828;font-size:13px"></p>
  </div>
</div>
<header><h1>📦 CondoExpress</h1><div class="userbar"><span id="loggedUser">Portaria</span><button class="logout" onclick="logout()">Sair</button></div></header>
<div class="container">
<nav>
<button class="active" onclick="show('home',this)">🏠 Início</button>
<button class="adminOnly" onclick="show('residents',this)">👥 Moradores</button>
<button class="adminOnly" onclick="show('register',this)">📦 Registrar Encomenda</button>
<button onclick="show('search',this)">🔎 Procurar Encomenda</button>
</nav>
<section id="home">
<div class="hero">
<div class="stat">Encomendas hoje<b id="todayCount">0</b></div>
<div class="stat">Aguardando retirada<b id="pendingCount">0</b></div>
<div class="stat">Entregues<b id="deliveredCount">0</b></div>
</div>
<div class="card">
<h2>Bem-vindo 👋</h2>
<p>Controle as encomendas do condomínio de forma simples.</p>
<div class="actions">
<button class="primary adminOnly" onclick="show('register',this)">📦 Registrar encomenda</button>
<button onclick="show('search',this)">🔎 Pesquisar</button>
</div>
</div>
</section>
<section id="residents" class="hidden">
<div class="card">
<h2>👥 Cadastro de Moradores</h2>
<form id="residentForm">
<div class="grid">
<div><label>Nome completo</label><input id="rName" required></div>
<div><label>Bloco</label><select id="rBlock"><option>A — Ouro Preto</option><option>B — Sabará</option></select></div>
<div><label>Apartamento</label><input id="rApt" required></div>
<div><label>Usuário de acesso</label><input id="rUser" required></div>
<div><label>Senha</label><input id="rPass" type="password" required></div>
</div><br>
<button class="primary" type="submit">➕ Cadastrar morador</button>
</form>
</div>
<div class="card">
<h3>Moradores cadastrados</h3>
<div id="residentList"></div>
</div>
</section>
<section id="register" class="hidden">
<div class="card">
<h2>📦 Registrar Encomenda</h2>
<form id="packageForm">
<div class="grid">
<div><label>Nome do morador</label><input id="name" required></div>
<div><label>Bloco</label><select id="block"><option>A — Ouro Preto</option><option>B — Sabará</option></select></div>
<div><label>Apartamento</label><input id="apt" required></div>
<div><label>Loja / Transportadora</label><input id="store" required></div>
<div><label>Código de rastreio</label><input id="tracking"></div>
</div>
<br>
<button class="primary" type="submit">✅ Registrar encomenda</button>
</form>
</div>
</section>
<section id="search" class="hidden">
<div class="card">
<h2>🔎 Procurar Encomenda</h2>
<input class="search" id="searchInput" placeholder="Digite o nome, apartamento..." oninput="renderPackages()">
<div id="packageList"></div>
</div>
</section>
</div>
<script>
let packages = JSON.parse(localStorage.getItem('packages') || '[]');
let residents = JSON.parse(localStorage.getItem('residents') || '[]');
let currentRole = null;
let selectedPackageId = null;

if(!residents.length) {
  residents = [
    {user:'admin',pass:'1234',name:'Portaria',role:'admin'},
    {user:'joao204',pass:'1234',name:'João',apt:'204',block:'B — Sabará'},
    {user:'maria102',pass:'1234',name:'Maria',apt:'102',block:'A — Ouro Preto'}
  ];
  localStorage.setItem('residents', JSON.stringify(residents));
}

function setLoginRole(role) {
  document.getElementById('adminTab').classList.toggle('active', role==='admin');
  document.getElementById('residentTab').classList.toggle('active', role==='resident');
  document.getElementById('adminLogin').classList.toggle('hidden', role!=='admin');
  document.getElementById('residentLogin').classList.toggle('hidden', role!=='resident');
}

function doLogin() {
  let user = document.getElementById('loginUser').value;
  let pass = document.getElementById('loginPass').value;
  let found = residents.find(r => r.user === user && r.pass === pass);
  if(found) {
    currentRole = found.role === 'admin' ? 'admin' : 'resident';
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('loggedUser').textContent = found.name;
    applyAccess();
    show('home', document.querySelector('nav button'));
  } else {
    document.getElementById('loginError').textContent = 'Usuário ou senha incorretos.';
  }
}

function logout() {
  currentRole = null;
  document.getElementById('loginOverlay').style.display = 'flex';
}

function applyAccess() {
  document.querySelectorAll('.adminOnly').forEach(x => x.style.display = currentRole==='admin' ? 'block' : 'none');
  updateStats(); renderPackages(); renderResidents();
}

function show(id, btn) {
  document.querySelectorAll('section').forEach(x => x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function updateStats() {
  let today = new Date().toLocaleDateString('pt-BR');
  document.getElementById('todayCount').textContent = packages.filter(p => p.date.startsWith(today)).length;
  document.getElementById('pendingCount').textContent = packages.filter(p => p.status !== 'Entregue').length;
  document.getElementById('deliveredCount').textContent = packages.filter(p => p.status === 'Entregue').length;
}

function openRecord(id) {
  selectedPackageId = id;
  renderPackages();
}

function sendMessage() {
  if(!selectedPackageId) return;
  let input = document.getElementById('chatMsgInput');
  let text = input.value.trim();
  if(!text) return;
  
  let pkg = packages.find(p => p.id === selectedPackageId);
  if(!pkg) return;
  
  if(!pkg.chat) pkg.chat = [];
  pkg.chat.push({
    from: currentRole === 'admin' ? 'Portaria' : 'Morador',
    text: text,
    time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
  });
  
  localStorage.setItem('packages', JSON.stringify(packages));
  input.value = '';
  renderPackages();
}

function renderPackages() {
  let q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  let list = packages.filter(p => Object.values(p).join(' ').toLowerCase().includes(q));
  document.getElementById('packageList').innerHTML = list.length ? list.map(p => {
    let isSelected = selectedPackageId === p.id;
    return `
    <div class="package">
      <div>
        <b>${p.name}</b> — Apto ${p.apt} • ${p.block}<br>
        📦 ${p.store}<br>
        <span class="small">Recebida: ${p.date}</span>
      </div>
      <span class="status">${p.status}</span>
      <div class="actions">
        ${!isSelected ? `<button class="blue" onclick="openRecord(${p.id})">📄 Abrir registro</button>` : ''}
        ${currentRole==='admin' && p.status!=='Entregue' ? `<button class="secondary" onclick="deliver(${p.id})">Marcar retirada</button>` : ''}
      </div>
      
      ${isSelected ? `
      <div class="record-block">
        <h3>📄 Registro da encomenda</h3>
        <p><strong>Morador:</strong> ${p.name} • Apto ${p.apt} • ${p.block}<br>
        <strong>Loja:</strong> ${p.store} • NF: - • Pedido: - • Rastreio: ${p.tracking || '-'}<br>
        <strong>Recebida:</strong> ${p.date} • <strong>Status:</strong> ${p.status}</p>
        
        <h3>💬 Conversa desta encomenda</h3>
        <p class="small">A conversa desta encomenda é diretamente com a portaria.</p>
        
        <div class="chat-box">
          ${!p.chat ? `
          <div class="chat-msg from-admin">
            <strong>📦 Portaria</strong><br>
            Conversa desta encomenda iniciada.<br>
            Envie uma mensagem abaixo.
          </div>
          ` : p.chat.map(m => `
          <div class="chat-msg ${m.from==='Portaria' ? 'from-admin' : ''}">
            <strong>${m.from==='Portaria' ? '📦 Portaria' : '👤 Morador'}</strong><br>
            ${m.text}<br>
            <span class="small">${m.time}</span>
          </div>
          `).join('')}
        </div>
        
        <div class="chat-input-area">
          <input type="text" id="chatMsgInput" placeholder="Digite uma mensagem para o morador...">
          <button class="primary" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
      ` : ''}
    </div>
  `}).join('') : '<p class="small">Nenhuma encomenda encontrada.</p>';
}

function renderResidents() {
  document.getElementById('residentList').innerHTML = residents.filter(r => r.role !== 'admin').map(r => `
    <div class="package">
      <div>
        <b>${r.name}</b><br>
        🏢 ${r.block} • Apto ${r.apt}<br>
        <span class="small">Usuário: ${r.user}</span>
      </div>
    </div>
  `).join('');
}

document.getElementById('packageForm').onsubmit = function(e) {
  e.preventDefault();
  let p = {
    id: Date.now(),
    name: document.getElementById('name').value,
    block: document.getElementById('block').value,
    apt: document.getElementById('apt').value,
    store: document.getElementById('store').value,
    tracking: document.getElementById('tracking').value,
    status: 'Aguardando retirada',
    date: new Date().toLocaleString('pt-BR')
  };
  packages.unshift(p);
  localStorage.setItem('packages', JSON.stringify(packages));
  alert('Encomenda registrada!');
  this.reset();
  selectedPackageId = p.id;
  show('search', null);
};

document.getElementById('residentForm').onsubmit = function(e) {
  e.preventDefault();
  residents.push({
    name: document.getElementById('rName').value,
    block: document.getElementById('rBlock').value,
    apt: document.getElementById('rApt').value,
    user: document.getElementById('rUser').value,
    pass: document.getElementById('rPass').value
  });
  localStorage.setItem('residents', JSON.stringify(residents));
  alert('Morador cadastrado!');
  this.reset();
  renderResidents();
};

function deliver(id) {
  let p = packages.find(x => x.id == id);
  if(!p) return;
  p.status = 'Entregue';
  p.withdrawnBy = prompt('Nome de quem retirou:');
  p.withdrawnDate = new Date().toLocaleDateString('pt-BR');
  localStorage.setItem('packages', JSON.stringify(packages));
  selectedPackageId = null;
  renderPackages(); updateStats();
}

setLoginRole('admin');
</script>
</body>
</html>
