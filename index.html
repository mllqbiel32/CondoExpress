<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f6f8;color:#1f2937;line-height:1.5}
header{background:#1769e0;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px}
.container{max-width:1000px;margin:20px auto;padding:0 16px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
nav button{border:none;border-radius:10px;padding:12px 16px;background:white;color:#1769e0;box-shadow:0 2px 4px rgba(0,0,0,.08);cursor:pointer;font-weight:bold}
nav button.active{background:#1769e0;color:white}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
h2{font-size:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label{font-size:14px;font-weight:bold;display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{border:none;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-cam{background:#1769e0;color:white;width:100%;margin:6px 0}
.btn-galeria{background:#6b7280;color:white;width:100%;margin:6px 0}
.whatsapp{background:#25d366;color:white;width:100%;margin-top:10px}
.primary{background:#1769e0;color:white}
.secondary{background:#e5e7eb;color:#374151}
.success{color:#16a34a;margin-top:8px}
.error{color:#dc2626;margin-top:8px}
.hidden{display:none !important}
.morador-item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn-sm{padding:8px 12px;font-size:13px}
.preview-img{max-width:180px;border-radius:10px;margin:10px 0}
.form-edit{background:#f9fafb;padding:16px;border-radius:12px;margin:12px 0}
</style>
</head>
<body>

<div id="telaLogin" class="card" style="max-width:420px;margin:30px auto">
  <h2 style="text-align:center">🔐 Acessar CondoExpress</h2>
  <div>
    <label>Usuário</label>
    <input type="text" id="inpUsuario" placeholder="Digite seu usuário">
    <label>Senha</label>
    <input type="password" id="inpSenha" placeholder="Digite sua senha">
    <button class="primary" style="width:100%;margin-top:12px" onclick="entrar()">Entrar</button>
    <p id="msgErroLogin" class="error hidden"></p>
  </div>
</div>

<div id="sistema" class="hidden">
<header>
  <h1>📦 CondoExpress — Bloco A Ouro Preto</h1>
  <button class="secondary btn-sm" onclick="sair()">Sair</button>
</header>

<div class="container">
<nav>
  <button class="active" onclick="mostrarAba('inicio')">🏠 Início</button>
  <button onclick="mostrarAba('registrar')">📦 Registrar Encomenda</button>
  <button onclick="mostrarAba('lista')">👥 Moradores</button>
</nav>

<section id="aba-inicio" class="aba">
  <div class="card">
    <h2>Bem-vindo(a) ao CondoExpress! 🏠</h2>
    <p style="margin:8px 0">Sistema de gestão de encomendas e cadastro — Bloco A · Ouro Preto</p>
    <p style="color:#666;font-size:14px;margin-top:10px">Selecione uma opção acima para começar.</p>
  </div>
</section>

<section id="aba-registrar" class="aba hidden">
<div class="card">
  <h2>📦 Registrar Encomenda</h2>

  <button type="button" class="btn-cam" onclick="document.getElementById('inputCam').click()">
    📷 Tirar Foto
  </button>
  <input type="file" id="inputCam" accept="image/*" capture="environment" style="display:none" onchange="processaFoto(this)">

  <button type="button" class="btn-galeria" onclick="document.getElementById('inputGaleria').click()">
    📁 Escolher da Galeria
  </button>
  <input type="file" id="inputGaleria" accept="image/*" style="display:none" onchange="processaFoto(this)">

  <img id="imgPreview" class="preview-img hidden" alt="Foto da encomenda">
  <button type="button" class="secondary hidden" id="btnNovaFoto" onclick="limparFoto()">🔄 Trocar Foto</button>
  <input type="hidden" id="fotoBase64">

  <div class="grid" style="margin-top:16px">
    <div>
      <label>Morador</label>
      <select id="selMorador" onchange="preencheDados()">
        <option value="">-- Selecione --</option>
      </select>
    </div>
    <div>
      <label>Apartamento</label>
      <input type="text" id="inpApto" readonly placeholder="Apartamento">
    </div>
    <div>
      <label>Bloco</label>
      <input type="text" id="inpBloco" readonly value="A — Ouro Preto">
    </div>
    <div>
      <label>Telefone / WhatsApp</label>
      <input type="text" id="inpTelefone" placeholder="Com DDD">
    </div>
  </div>

  <button class="whatsapp" onclick="enviarEncomenda()">✅ Registrar e Enviar no WhatsApp</button>
  <p id="msgStatus" class="hidden" style="margin-top:10px"></p>
</div>
</section>

<section id="aba-lista" class="aba hidden">
<div class="card">
  <h2>👥 Moradores — Bloco A Ouro Preto</h2>
  <div id="listaMoradores"></div>
</div>
</section>

</div>
</div>
