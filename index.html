<title>CondoExpress</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f4f8;padding:16px}
.container{max-width:480px;margin:0 auto}
h1{font-size:24px;color:#1e40af;text-align:center;margin:20px 0}
.card{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:18px;font-size:18px;font-weight:bold;color:white;cursor:pointer;margin:10px 0;text-align:center}
.btn-a{background:#1e40af}
.btn-b{background:#16a34a}
.btn-portaria{background:#f59e0b}
.btn-sair{background:#e5e7eb;color:#374151;max-width:250px;margin:0 auto 20px}
.btn-enviar{background:#16a34a}
label{font-weight:bold;display:block;margin:15px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.tela{display:none}
.tela.ativa{display:block}
.aba{display:none}
.aba.ativa{display:block}
.hidden{display:none}
.sucesso{background:#dcfce7;color:#166534;padding:15px;border-radius:8px;margin-top:15px;text-align:center;font-weight:bold}
</style>
</head>

<div class="container">

<!-- TELA INÍCIO -->
<div id="inicio" class="tela ativa">
<h1>📦 CondoExpress</h1>
<div class="card">
<button class="btn btn-a" onclick="ir('moradorA')">BLOCO A — Ouro Preto</button>
<button class="btn btn-b" onclick="ir('moradorB')">BLOCO B — Sabará</button>
<button class="btn btn-portaria" onclick="document.getElementById('senha').classList.remove('hidden')">🔑 PORTARIA</button>

<div id="senha" class="hidden">
<label>Senha:</label>
<input type="password" id="senhaInput">
<button class="btn btn-portaria" onclick="verificar()">Entrar</button>
</div>
</div>
</div>

<!-- TELA PORTARIA -->
<div id="portaria" class="tela">
<h1>🔑 Portaria</h1>
<button class="btn btn-sair" onclick="ir('inicio')">⬅️ Voltar</button>

<button class="btn" style="background:#1e40af" onclick="mostrarAba('regA')">📦 Bloco A</button>
<button class="btn" style="background:#16a34a" onclick="mostrarAba('regB')">📦 Bloco B</button>

<div id="regA" class="aba ativa card">
<label>Apartamento:</label>
<select id="selA"></select>
<label>Empresa/Loja:</label>
<input type="text" id="empresaA">
<button class="btn btn-enviar" onclick="salvarA()">✅ REGISTRAR</button>
<div id="msgA" class="sucesso hidden">✅ Enviado!</div>
</div>

<div id="regB" class="aba card">
<label>Apartamento:</label>
<select id="selB"></select>
<label>Empresa/Loja:</label>
<input type="text" id="empresaB">
<button class="btn btn-enviar" onclick="salvarB()">✅ REGISTRAR</button>
<div id="msgB" class="sucesso hidden">✅ Enviado!</div>
</div>
</div>

<!-- TELA MORADOR A -->
<div id="moradorA" class="tela">
<h1>🏠 Bloco A</h1>
<button class="btn btn-sair" onclick="ir('inicio')">⬅️ Voltar</button>
<div class="card">
<label>Seu apartamento:</label>
<select id="meuA" onchange="verMinhas('A')"></select>
<div id="listaA"></div>
</div>
</div>

<!-- TELA MORADOR B -->
<div id="moradorB" class="tela">
<h1>🏠 Bloco B</h1>

<select id="meuB" onchange="verMinhas('B')"></select>

let encA = JSON.parse(localStorage.getItem('encA')||'[]');
let encB = JSON.parse(localStorage.getItem('encB')||'[]');

function ir(id){document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));document.getElementById(id).classList.add('ativa')}
function mostrarAba(id){document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));document.getElementById(id).classList.add('ativa')}

function verificar(){if(document.getElementById('senhaInput').value===SENHA){ir('portaria');carregarSelects()}}

function carregarSelects(){
  let sA = document.getElementById('selA'); sA.innerHTML='<option value="">-- Selecione --</option>';
  blocoA.forEach((m,i)=>sA.innerHTML+=`<option value="${i}">${m.apto} — ${m.nome}</option>`);
  let sB = document.getElementById('selB'); sB.innerHTML='<option value="">-- Selecione --</option>';
  blocoB.forEach((m,i)=>sB.innerHTML+=`<option value="${i}">${m.apto} — ${m.nome}</option>`);
  let mA = document.getElementById('meuA'); mA.innerHTML='<option value="">-- Seu apartamento --</option>';
  blocoA.forEach((m,i)=>mA.innerHTML+=`<option value="${i}">${m.apto}</option>`);
  let mB = document.getElementById('meuB'); mB.innerHTML='<option value="">-- Seu apartamento --</option>';
  blocoB.forEach((m,i)=>mB.innerHTML+=`<option value="${i}">${m.apto}</option>`);
}

function salvarA(){
  let i = document.getElementById('selA').value;
  let emp = document.getElementById('empresaA').value.trim();
  if(!i||!emp){alert('Preencha tudo!');return}
  encA.unshift({apto:blocoA[i].apto,nome:blocoA[i].nome,empresa:emp,data:new Date().toLocaleString('pt-BR')});
  localStorage.setItem('encA',JSON.stringify(encA));
  document.getElementById('msgA').classList.remove('hidden');
  document.getElementById('empresaA').value='';
  setTimeout(()=>document.getElementById('msgA').classList.add('hidden'),3000);
}

function salvarB(){
  let i = document.getElementById('selB').value;
  let emp = document.getElementById('empresaB').value.trim();
  if(!i||!emp){alert('Preencha tudo!');return}
  encB.unshift({apto:blocoB[i].apto,nome:blocoB[i].nome,empresa:emp,data:new Date().toLocaleString('pt-BR')});
  localStorage.setItem('encB',JSON.stringify(encB));
  document.getElementById('msgB').classList.remove('hidden');
  document.getElementById('empresaB').value='';
  setTimeout(()=>document.getElementById('msgB').classList.add('hidden'),3000);
}

function verMinhas(b){
  let sel = document.getElementById('meu'+b).value;
  let lista = document.getElementById('lista'+b);
  if(!sel){lista.innerHTML='';return}
  let todas = b==='A'?encA:encB;
  let minhas = todas.filter(e=>e.apto === (b==='A'?blocoA:blocoB)[sel].apto);
  if(!minhas.length){lista.innerHTML='<p style="color:green">✅ Nenhuma encomenda</p>';return}
  lista.innerHTML='';
  minhas.forEach(e=>lista.innerHTML+=`<p style="padding:10px 0;border-bottom:1px solid #ddd"><strong>📦 ${e.empresa}</strong><br><small>${e.data}</small></p>`);
}
