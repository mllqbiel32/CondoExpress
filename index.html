<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças do Casal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f51b5">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1, h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; }
    
    .cards-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .card { flex: 1; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card h3 { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 5px; }
    .card p { font-size: 1.2rem; font-weight: bold; }
    .entradas { color: #27ae60; }
    .saidas { color: #c0392b; }
    .saldo { color: #2980b9; }

    form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    input, select, button { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
    button { background-color: #3f51b5; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #303f9f; }

    .historico { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .item-transacao { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .item-transacao:last-child { border-bottom: none; }
    .detalhes-transacao strong { display: block; font-size: 1rem; }
    .detalhes-transacao small { color: #7f8c8d; font-size: 0.8rem; }
    .valor-transacao { font-weight: bold; }
    .valor-entrada { color: #27ae60; }
    .valor-saida { color: #c0392b; }
  </style>

  <!-- Firebase Scripts Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>💰 Finanças do Casal</h1>

  <div class="cards-container">
    <div class="card">
      <h3>Entradas</h3>
      <p id="total-entradas" class="entradas">R$ 0,00</p>
    </div>
    <div class="card">
      <h3>Saídas</h3>
      <p id="total-saidas" class="saidas">R$ 0,00</p>
    </div>
    <div class="card">
      <h3>Saldo</h3>
      <p id="saldo-total" class="saldo">R$ 0,00</p>
    </div>
  </div>

  <form id="form-transacao">
    <h2>Novo Lançamento</h2>
    
    <div class="form-group">
      <label for="quem">Quem está lançando?</label>
      <select id="quem" required>
        <option value="Ele">Ele</option>
        <option value="Ela">Ela</option>
      </select>
    </div>

    <div class="form-group">
      <label for="tipo">Tipo</label>
      <select id="tipo" required>
        <option value="saida">Saída (Gasto)</option>
        <option value="entrada">Entrada (Receita)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" placeholder="Ex: Mercado, Luz, Salário" required>
    </div>

    <div class="form-group">
      <label for="valor">Valor (R$)</label>
      <input type="number" id="valor" step="0.01" placeholder="0,00" required>
    </div>

    <button type="submit">Adicionar Lançamento</button>
  </form>

  <div class="historico">
    <h2>Histórico do Mês</h2>
    <div id="lista-transacoes">
      <p style="text-align: center; color: #7f8c8d;">Carregando dados...</p>
    </div>
  </div>

  <script>
    // Suas chaves exatas do Firebase extraídas do seu projeto antigo:
    const firebaseConfig = {
      apiKey: "AIzaSyBK3ptWyBo5nxB9SjFZkMLVvP",
      authDomain: "condoexpress-a20e0.firebaseapp.com",
      projectId: "condoexpress-a20e0",
      storageBucket: "condoexpress-a20e0.firebasestorage.app",
      messagingSenderId: "800579097935",
      appId: "1:800579097935:web:7ef0b0de349b3",
      measurementId: "G-9E1MW2B2VY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('form-transacao');
    const listaTransacoes = document.getElementById('lista-transacoes');
    const totalEntradasEl = document.getElementById('total-entradas');
    const totalSaidasEl = document.getElementById('total-saidas');
    const saldoTotalEl = document.getElementById('saldo-total');

    // Registrar nova transação
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const quem = document.getElementById('quem').value;
      const tipo = document.getElementById('tipo').value;
      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);

      try {
        await db.collection('financas').add({
          quem: quem,
          tipo: tipo,
          descricao: descricao,
          valor: valor,
          timestamp: Date.now(),
          data: new Date().toLocaleDateString('pt-BR')
        });

        form.reset();
      } catch (erro) {
        alert("Erro ao salvar lançamento: " + erro.message);
      }
    });

    // Ouvir atualizações em tempo real
    db.collection('financas').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
      let html = '';
      let totalEntradas = 0;
      let totalSaidas = 0;

      if (snapshot.empty) {
        listaTransacoes.innerHTML = '<p style="text-align: center; color: #7f8c8d;">Nenhum lançamento encontrado.</p>';
        totalEntradasEl.textContent = 'R$ 0,00';
        totalSaidasEl.textContent = 'R$ 0,00';
        saldoTotalEl.textContent = 'R$ 0,00';
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const classeValor = item.tipo === 'entrada' ? 'valor-entrada' : 'valor-saida';
        const sinal = item.tipo === 'entrada' ? '+' : '-';

        if (item.tipo === 'entrada') {
          totalEntradas += item.valor;
        } else {
          totalSaidas += item.valor;
        }

        html += `
          <div class="item-transacao">
            <div class="detalhes-transacao">
              <strong>${item.descricao}</strong>
              <small>Lançado por: ${item.quem} em ${item.data}</small>
            </div>
            <div class="valor-transacao ${classeValor}">
              ${sinal} R$ ${item.valor.toFixed(2).replace('.', ',')}
            </div>
          </div>
        `;
      });

      listaTransacoes.innerHTML = html;

      const saldo = totalEntradas - totalSaidas;
      totalEntradasEl.textContent = `R$ ${totalEntradas.toFixed(2).replace('.', ',')}`;
      totalSaidasEl.textContent = `R$ ${totalSaidas.toFixed(2).replace('.', ',')}`;
      saldoTotalEl.textContent = `R$ ${saldo.toFixed(2).replace('.', ',')}`;
    });

    // Registro do Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registrado'))
        .catch((err) => console.log('Erro ao registrar Service Worker', err));
    }
  </script>
</body>
</html>
