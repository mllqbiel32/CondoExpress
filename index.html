<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f6f8;color:#1f2937;line-height:1.5;padding:16px}
.card{background:white;border-radius:16px;padding:24px;margin:16px auto;box-shadow:0 3px 15px rgba(0,0,0,.06);max-width:420px}
.card-largo{max-width:900px}
h2{font-size:18px;margin-bottom:20px;text-align:center;color:#1769e0}
label{font-size:14px;font-weight:bold;display:block;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{border:none;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;font-size:15px;width:100%}
.btn-cam{background:#1769e0;color:white;margin:6px 0}
.btn-galeria{background:#6b7280;color:white;margin:6px 0}
.whatsapp{background:#25d366;color:white;margin-top:12px}
.primary{background:#1769e0;color:white;margin-top:16px}
.secondary{background:#e5e7eb;color:#374151;margin-top:8px}
.editar{background:#facc15;color:#854d0e;margin:4px 0 0 8px;width:auto;display:inline-block;padding:6px 12px;font-size:13px}
.salvar{background:#16a34a;color:white;margin-top:12px}
.cancelar{background:#e5e7eb;color:#374151;margin-top:8px}
.perigo{background:#fee2e2;color:#b91c1c;margin-top:8px}
.success{color:#16a34a;margin-top:10px}
.error{color:#dc2626;margin-top:10px}
.info{color:#4b5563;margin-top:10px;font-size:14px}
.hidden{display:none !important}
.preview-img{max-width:180px;border-radius:10px;margin:12px 0}
.leitura-status{padding:10px 14px;background:#eef2ff;border-radius:8px;margin:12px 0;color:#1e40af;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px auto;max-width:900px}
nav button{width:auto;box-shadow:0 2px 4px rgba(0,0,0,.08);background:white;color:#1769e0}
nav button.active{background:#1769e0;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.item-encomenda{padding:14px;border-bottom:1px solid #eee}
.item-morador{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.area-senha{background:#f9fafb;padding:16px;border-radius:12px;margin-top:16px}
.aviso{background:#fef3c7;padding:12px;border-radius:8px;color:#92400e;margin-bottom:16px}
.form-editar{background:#eff6ff;padding:16px;border-radius:12px;margin:16px 0;border-left:4px solid #1769e0}
</style>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="card">
  <h2>🔐 Acessar CondoExpress</h2>
  <label>Usuário</label>
  <input type="text" id="inpUsuario" placeholder="Digite seu usuário">
  <label>Senha</label>
  <input type="password" id="inpSenha" placeholder="Digite sua senha">
  <button class="primary" onclick="entrar()">Entrar</button>
  <p id="msgErroLogin" class="error hidden" style="text-align:center"></p>
</div>

<!-- SISTEMA PRINCIPAL -->
<div id="sistema" class="hidden">

  </nav>

  <nav id="menuMorador" class="hidden">

  <section id="aba-inicio" class="aba card card-largo">

    <p id="textoInicio" style="margin:8px 0"></p>
  </section>

  <section id="aba-registrar" class="aba hidden card card-largo">
    <h2>📦 Registrar Encomenda</h2>
    <button type="button" class="btn-cam" onclick="document.getElementById('inputCam').click()">📷 Tirar Foto</button>

    <input type="file" id="inputGaleria" accept="image/*" style="display:none" onchange="arquivoSelecionado(this)">
    <img id="imgPreview" class="preview-img hidden" alt="Foto carregada">
    <p id="statusLeitura" class="leitura-status hidden"></p>
    <button type="button" class="secondary hidden" id="btnLimparFoto" onclick="limparFoto()">❌ Trocar Foto</button>
    <input type="hidden" id="fotoBase64">
    <div class="grid">
      <div><label>Nome do Morador</label><input type="text" id="inpNome" placeholder="Nome — preenche automático"></div>
      <div><label>Apartamento</label><input type="text" id="inpApto" placeholder="Ex: 012OP"></div>
      <div><label>Bloco</label><input type="text" id="inpBloco" value="A — Ouro Preto" readonly></div>
      <div><label>Telefone / WhatsApp</label><input type="text" id="inpTelefone" placeholder="Com DDD"></div>
    </div>
    <button class="whatsapp" onclick="enviarEncomenda()">✅ Registrar e Enviar no WhatsApp</button>
    <p id="msgStatus" class="hidden"></p>
  </section>

  <section id="aba-minhas" class="aba hidden card card-largo">
    <h2>📦 Minhas Encomendas</h2>
    <div id="listaMinhas"></div>
  </section>

  <section id="aba-lista" class="aba hidden card card-largo">
    <h2>👥 Moradores — Bloco A Ouro Preto</h2>
    
    <!-- FORMULÁRIO DE EDITAR MORADOR -->
    <div id="formEditarMorador" class="form-editar hidden">
      <h3 style="font-size:16px;margin-bottom:12px">✏️ Editar Morador — <span id="editarAptoTitulo"></span></h3>
      <input type="hidden" id="indiceEditar">
      <label>Nome Completo</label><input type="text" id="editarNome" placeholder="Digite o nome completo">
      <label>Usuário de Acesso</label><input type="text" id="editarUsuario" placeholder="Ex: maria.123">
      <label>Senha</label><input type="text" id="editarSenha" placeholder="Ex: op123">
      <label>Telefone / WhatsApp</label><input type="text" id="editarTelefone" placeholder="Com DDD">
      <button class="salvar" onclick="salvarEdicao()">💾 Salvar Alterações</button>
      <button class="cancelar" onclick="cancelarEdicao()">❌ Cancelar</button>
      <p id="msgEdicao" class="hidden"></p>
    </div>

    <div id="listaMoradores"></div>
  </section>

  <section id="aba-config" class="aba hidden card card-largo">
    <h2 id="tituloConfig">⚙️ Configurações</h2>
    <div class="area-senha">
      <h3 style="font-size:16px;margin-bottom:12px">🔑 Alterar Senha</h3>
      <label>Senha Atual</label><input type="password" id="senhaAtual" placeholder="Digite sua senha atual">
      <label>Nova Senha</label><input type="password" id="senhaNova" placeholder="Digite a nova senha">
      <label>Repetir Nova Senha</label><input type="password" id="senhaNova2" placeholder="Digite a nova senha de novo">

      <p id="msgSenha" class="hidden"></p>
    </div>
    <div id="areaAdminConfig" class="hidden area-senha">

      <button class="primary" onclick="alterarDadosAdmin()">Salvar Dados</button>
      <p id="msgAdminDados" class="hidden"></p>
    </div>
  </section>
</div>

let admin = {usuario:"admin",senha:"condo2026",nome:"Portaria — Administrador"};
let usuarioLogado = null;
let ehAdmin = false;

function entrar(){
  const u = document.getElementById('inpUsuario').value.trim();
  const s = document.getElementById('inpSenha').value.trim();
  if(u === admin.usuario && s === admin.senha){
    ehAdmin = true;
    usuarioLogado = {tipo:'admin',nome:admin.nome};
    document.getElementById('telaLogin').classList.add('hidden');
    document.getElementById('sistema').classList.remove('hidden');
    document.getElementById('nomeLogado').textContent = `👤 ${admin.nome}`;
    document.getElementById('menuAdmin').classList.remove('hidden');
    document.getElementById('areaAdminConfig').classList.remove('hidden');
    document.getElementById('textoInicio').textContent = "Bem-vindo! Você tem acesso completo: registrar encomendas, ver/editar moradores e alterar configurações.";
    carregaListaMoradores();
    return;
  }
  const m = moradores.find(x => x.usuario === u && x.senha === s);
  if(m){
    ehAdmin = false;
    usuarioLogado = {tipo:'morador',nome:m.nome,apto:m.apto,dados:m};
    document.getElementById('telaLogin').classList.add('hidden');
    document.getElementById('sistema').classList.remove('hidden');
    document.getElementById('nomeLogado').textContent = `👤 ${m.nome} — Apto ${m.apto}`;
    document.getElementById('menuMorador').classList.remove('hidden');
    document.getElementById('textoInicio').innerHTML = `Bem-vindo(a)! Aqui você acompanha suas encomendas e pode alterar sua senha.<br><span style="color:red;font-size:13px">⚠️ Você não pode registrar encomendas — isso é feito pela portaria.</span>`;
    return;
  }
  const e = document.getElementById('msgErroLogin');
  e.textContent = "Usuário ou senha incorretos!";
  e.classList.remove('hidden');
}

function sair(){
  usuarioLogado = null; ehAdmin = false;
  document.getElementById('sistema').classList.add('hidden');
  document.getElementById('telaLogin').classList.remove('hidden');
  document.getElementById('inpUsuario').value = '';
  document.getElementById('inpSenha').value = '';
  document.getElementById('msgErroLogin').classList.add('hidden');
  document.getElementById('menuAdmin').classList.add('hidden');
  document.getElementById('menuMorador').classList.add('hidden');
  document.getElementById('areaAdminConfig').classList.add('hidden');
  document.querySelectorAll('.aba').forEach(a => a.classList.add('hidden'));
}

function mostrarAba(nome){
  document.querySelectorAll('.aba').forEach(a => a.classList.add('hidden'));
  document.getElementById(`aba-${nome}`).classList.remove('hidden');
  if(ehAdmin){
    document.querySelectorAll('#menuAdmin button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if(nome === 'lista') carregaListaMoradores();
  }else{
    document.querySelectorAll('#menuMorador button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if(nome === 'minhas') carregaMinhasEncomendas();
  }
}

function arquivoSelecionado(input){
  if(!ehAdmin){alert("Acesso negado!");return}
  if(!input.files.length) return;
  const arq = input.files[0];
  const leitor = new FileReader();
  leitor.onload = function(e){
    const img = document.getElementById('imgPreview');
    img.src = e.target.result;
    img.classList.remove('hidden');
    document.getElementById('fotoBase64').value = e.target.result;
    document.getElementById('btnLimparFoto').classList.remove('hidden');
    lerTextoDaFoto(e.target.result);
  };
  leitor.readAsDataURL(arq);
  input.value = '';
}

async function lerTextoDaFoto(base64){
  const status = document.getElementById('statusLeitura');
  status.classList.remove('hidden');
  status.className = 'leitura-status';
  status.textContent = "🔍 Lendo a foto...";
  try{
    const resultado = await Tesseract.recognize(base64, 'por', {
      logger: m => {if(m.status === 'recognizing text') status.textContent = `🔍 Lendo... ${Math.round(m.progress * 100)}%`;}
    });
    const texto = resultado.data.text.toUpperCase();
    status.textContent = "✅ Foto lida! Procurando morador...";
    const encontrado = procuraMorador(texto);
    if(encontrado){
      document.getElementById('inpNome').value = encontrado.nome;
      document.getElementById('inpApto').value = encontrado.apto;
      document.getElementById('inpTelefone').value = encontrado.telefone || '';
      status.textContent = `✅ Encontrado: ${encontrado.nome} — ${encontrado.apto}`;
      status.classList.add('success');
    }else{
      status.textContent = "⚠️ Não encontrou. Preencha à mão.";
      status.classList.add('error');
    }
  }catch(erro){
    status.textContent = "❌ Erro ao ler. Preencha à mão.";
    status.classList.add('error');
  }
}

function procuraMorador(texto){
  for(const m of moradores){
    if(texto.includes(m.apto.toUpperCase())) return {nome:m.nome,apto:m.apto,telefone:m.telefone};
    const partes = m.nome.toUpperCase().split(/\s+/).filter(p => p.length > 3);
    if(partes.some(p => texto.includes(p))) return {nome:m.nome,apto:m.apto,telefone:m.telefone};
  }
  return null;
}

function limparFoto(){
  document.getElementById('imgPreview').classList.add('hidden');
  document.getElementById('statusLeitura').classList.add('hidden');
  document.getElementById('btnLimparFoto').classList.add('hidden');
  document.getElementById('fotoBase64').value = '';
  document.getElementById('inpNome').value = '';
  document.getElementById('inpApto').value = '';
  document.getElementById('inpTelefone').value = '';
}

function enviarEncomenda(){
  if(!ehAdmin){alert("Acesso negado!");return}
  const nome = document.getElementById('inpNome').value.trim();
  const apto = document.getElementById('inpApto').value.trim();
  const bloco = document.getElementById('inpBloco').value.trim();
  const tel = document.getElementById('inpTelefone').value.trim();
  if(!nome || !apto){alert("Preencha Nome e Apartamento!");return}
  if(!tel){alert("Preencha o Telefone/WhatsApp!");return}
  const m = moradores.find(x => x.apto === apto);
  if(m){
    m.encomendas.push({data: new Date().toLocaleString('pt-BR'),nome:nome,apto:apto});
  }
  const msg = `📦 ENCOMENDA — Condomínio Ouro Preto e Sabará\n\nMorador: ${nome}\nApto: ${apto} — ${bloco}\n\nSua encomenda chegou! Pode retirar na portaria.`;
  const numero = tel.replace(/\D/g,'');
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
  alert("✅ Encomenda registrada! Mensagem aberta no WhatsApp!");
  limparFoto();
}

function carregaMinhasEncomendas(){
  const m = usuarioLogado.dados;
  const div = document.getElementById('listaMinhas');
  if(m.encomendas.length === 0){
    div.innerHTML = '<p style="text-align:center;color:#666;padding:20px">📭 Nenhuma encomenda registrada ainda.</p>';
    return;
  }
  div.innerHTML = m.encomendas.map(e => `<div class="item-encomenda"><strong>📦 Encomenda registrada</strong><br>📅 ${e.data}<br>🏠 Apto: ${e.apto}</div>`).join('');
}

function carregaListaMoradores(){
  if(!ehAdmin) return;
  const div = document.getElementById('listaMoradores');
  div.innerHTML = moradores.map((m, i) => `
    <div class="item-morador">
      <div>
        <strong>${m.apto}</strong> — ${m.nome || '⚠️ PREENCHER NOME'}<br>
        <small>Usuário: ${m.usuario} | Senha: ${m.senha} | Encomendas: ${m.encomendas.length}</small>
      </div>
      <button class="editar" onclick="abrirEdicao(${i})">✏️ Editar</button>
    </div>
  `).join('');
}

function abrirEdicao(indice){
  const m = moradores[indice];
  document.getElementById('indiceEditar').value = indice;
  document.getElementById('editarAptoTitulo').textContent = m.apto;
  document.getElementById('editarNome').value = m.nome;
  document.getElementById('editarUsuario').value = m.usuario;
  document.getElementById('editarSenha').value = m.senha;
  document.getElementById('editarTelefone').value = m.telefone;
  document.getElementById('formEditarMorador').classList.remove('hidden');
  document.getElementById('msgEdicao').classList.add('hidden');
}

function salvarEdicao(){
  const i = parseInt(document.getElementById('indiceEditar').value);
  const nome = document.getElementById('editarNome').value.trim();
  const usuario = document.getElementById('editarUsuario').value.trim();
  const senha = document.getElementById('editarSenha').value.trim();
  const telefone = document.getElementById('editarTelefone').value.trim();
  const msg = document.getElementById('msgEdicao');
  msg.classList.add('hidden');
  
  if(!usuario || !senha){
    msg.textContent = "Usuário e Senha não podem ficar vazios!";
    msg.className = 'error';
    msg.classList.remove('hidden');
    return;
  }
  
  moradores[i].nome = nome;
  moradores[i].usuario = usuario;
  moradores[i].senha = senha;
  moradores[i].telefone = telefone;
  
  msg.textContent = "✅ Dados salvos com sucesso!";
  msg.className = 'success';
  msg.classList.remove('hidden');
  
  setTimeout(() => {
    document.getElementById('formEditarMorador').classList.add('hidden');
    carregaListaMoradores();
  }, 1200);
}

function cancelarEdicao(){
  document.getElementById('formEditarMorador').classList.add('hidden');
  document.getElementById('msgEdicao').classList.add('hidden');
}

function alterarSenha(){
  const atual = document.getElementById('senhaAtual').value.trim();
  const nova = document.getElementById('senhaNova').value.trim();
  const nova2 = document.getElementById('senhaNova2').value.trim();
  const msg = document.getElementById('msgSenha');
  msg.classList.add('hidden');
  if(!atual || !nova || !nova2){msg.textContent = "Preencha todos os campos!";msg.className = 'error';msg.classList.remove('hidden');return}
  if(nova !== nova2){msg.textContent = "As senhas novas não são iguais!";msg.className = 'error';msg.classList.remove('hidden');return}
  if(nova.length < 4){msg.textContent = "A senha precisa ter pelo menos 4 caracteres!";msg.className = 'error';msg.classList.remove('hidden');return}
  if(ehAdmin){
    if(atual !== admin.senha){msg.textContent = "Senha atual incorreta!";msg.className = 'error';msg.classList.remove('hidden');return}
    admin.senha = nova;
  }else{
    const m = usuarioLogado.dados;
    if(atual !== m.senha){msg.textContent = "Senha atual incorreta!";msg.className = 'error';msg.classList.remove('hidden');return}
    m.senha = nova;
  }
  msg.textContent = "✅ Senha alterada com sucesso!";
  msg.className = 'success';
  msg.classList.remove('hidden');
  document.getElementById('senhaAtual').value = '';
  document.getElementById('senhaNova').value = '';
  document.getElementById('senhaNova2').value = '';
}

function alterarDadosAdmin(){
  const nomeNovo = document.getElementById('nomeAdminAtual').value.trim();
  const usuarioNovo = document.getElementById('usuarioAdminNovo').value.trim();
  const msg = document.getElementById('msgAdminDados');
  msg.classList.add('hidden');
  if(!nomeNovo || !usuarioNovo){msg.textContent = "Preencha todos os campos!";msg.className = 'error';msg.classList.remove('hidden');return}
  admin.nome = nomeNovo;
  admin.usuario = usuarioNovo;
  document.getElementById('nomeLogado').textContent = `👤 ${admin.nome}`;
  msg.textContent = "✅ Dados alterados com sucesso!";
  msg.className = 'success';
  msg.classList.remove('hidden');
}
</script>
